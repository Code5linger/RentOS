services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentos
      POSTGRES_PASSWORD: rentos_secret
      POSTGRES_DB: rentos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentos']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

  # Add to docker-compose.yml under services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentos
      POSTGRES_PASSWORD: rentos_secret
      POSTGRES_DB: rentos_test
    ports:
      - '5433:5432' # Different port — dev and test DBs never collide
    tmpfs:
      - /var/lib/postgresql/data # In-memory — tests run faster, data never persists
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentos']
      interval: 5s
      timeout: 5s
      retries: 5
