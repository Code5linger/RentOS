services:
  # Web Service
  - type: web
    name: rentos-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rentos-db
          property: connectionString

  # PostgreSQL Database
  - type: postgres
    name: rentos-db
    plan: free
    ipAllowList: []
    databaseName: rentos_db
